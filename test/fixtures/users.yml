<% test_user_email = ENV.fetch('TEST_USER_EMAIL', 'example@mail.com') %>
<% test_user_password_digest = BCrypt::Password.create(ENV.fetch('TEST_USER_PASSWORD', 'password')) %>
<% password_digest = BCrypt::Password.create('password') %>

# You run a small bakery, and your linktree is the link you put in your Instagram bio
me:
  email: <%= test_user_email %>
  password_digest: <%= test_user_password_digest %>

# Dave is a good friend. He has claimed a username, but is still working on his page
dave:
  email: dave@mail.com
  password_digest: <%= password_digest %>

# New Recruit has an account from before Twine became a linktree service, and has yet to pick a username
new_recruit:
  email: new.recruit@mail.com
  password_digest: <%= password_digest %>
